er/dust-meter2.webp\",\"infoTitle1\":\"Ultra‑low laser extractive dust meter\",\"details\":[\"On-line stack particle concentration monitoring system capable of measuring dust concentration in harsh conditions such as high wind speeds, rain, dust, and extreme temperatures.\"]},{\"ID\":\"Dust-Meter-1\",\"title\":\"In Situ Dust Meter\",\"image\":\"/images/sensors/dust-meter/dust-meter.png\",\"infoTitle1\":\"Type: In‑Situ\",\"details\":[\"Uses the principle of laser backscatter testing for measuring flue dust concentration. A stable embedded laser source passes through the flue, illuminates particles, and the reflected signal intensity varies proportionally with dust concentration.\"]}],\"CEMS\":[{\"ID\":\"CEMS-0\",\"title\":\"Gasboard-9050\",\"image\":\"/images/sensors/cems/gasboard-9050-big.png\",\"infoTitle1\":\"On‑line pollutant monitoring system using innovative Micro‑flow NDIR technology capable of simultaneous measurement of SO₂, NO, CO, CO₂, and O₂ (via ECD).\",\"details\":[\"Continuously monitors gaseous pollutants via heating extraction method.\",\"Replaceable sampling probe filter with ample filter housing space.\",\"Fully functional PLC data acquisition system with user‑friendly interface.\",\"Multiple output data formats.\",\"Modular analyzer cabinet design for easy operation.\",\"Flexible analyzer selection based on application requirements.\"]},{\"ID\":\"CEMS-1\",\"title\":\"Gasboard-3050\",\"image\":\"/images/sensors/cems/gasboard-3050.png\",\"infoTitle1\":\"Gasboard-3050 features high accuracy and long service life. Ideal oxygen and moisture analyzer for high‑temperature and high‑humidity conditions.\",\"details\":[\"Simultaneous measurement of O₂ and H₂O concentrations.\",\"Detector equipped with heater to prevent water condensation.\",\"Constructed from stainless steel for high corrosion resistance, suitable for harsh environments.\",\"Supports communication via RS‑232 and RS‑485.\"]},{\"ID\":\"CEMS-2\",\"title\":\"GAS TDL-3000\",\"image\":\"/images/s

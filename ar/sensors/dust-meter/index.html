ge\":\"/images/sensors/gas-analyzer/gas-analyzer-3000plus.png\",\"infoTitle1\":\"النوع: (online)\",\"infoTitle2\":\"قادر على قياس دقيق للملوثات منخفضة التركيز SO2 و NO و NO2 (اختياري)\",\"details\":[\"قادر على قياس دقيق للملوثات منخفضة التركيز SO2 و NO و NO2 (اختياري)\",\"قياس NO و NO2 في نفس الوقت بدون الحاجة إلى محول NOX\",\"لا يحتوي على أجزاء بصرية متحركة\",\"لا تؤثر الاهتزازات على نتائج القياس\",\"أداء مستقر دون تداخل من الغبار أو الرطوبة\",\"لا تؤثر تقلبات معدل تدفق العينة على نتائج القياس\",\"قدرة على التشخيص الذاتي لحالة المستشعر\"]},{\"ID\":\"Gas-Analyzer-3\",\"title\":\"Gasboard-3600UV\",\"image\":\"/images/sensors/gas-analyzer/gas-analyzer-3600UV.png\",\"infoTitle1\":\"النوع: (online)\",\"infoTitle2\":\"مقاوم للاهتزازات القوية.\",\"details\":[\"طريقة الساخن والرطب: يدخل غاز المدخنة مباشرة إلى المحلل عبر خط أخذ العينات الساخن دون أي خسارة ناتجة عن تكثيف SO2 ومكونات أخرى\",\"حد كشف منخفض: مسار بصري طويل بتصميم انعكاس متعدد، مناسب لرصد الانبعاثات منخفضة المستوى جدًا\",\"الطريقة البصرية: قياس مباشر لـ NO و NO2، بدون الحاجة إلى محول NOx\",\"استقرار جيد: المسار البصري خالٍ من الأجزاء الميكانيكية المتحركة.\",\"مقاوم للاهتزازات القوية.\",\"سهولة الصيانة: إمكانية تنظيف غرفة القياس والصيانة بسهولة\"]},{\"ID\":\"Gas-Analyzer-4\",\"title\":\"Gasboard-3001\",\"image\":\"/images/sensors/gas-analyzer/gasboard-3001.png\",\"infoTitle1\":\"النوع: محمول (portable)\",\"infoTitle2\":\"قياس دقيق للغاز بتركيز منخفض يصل إلى 200 ppm\",\"details\":[\"قياس في نطاقات منخفضة جدًا وحد كشف منخفض يصل إلى 1 ppb (جزء في المليار)\",\"أداء موثوق وعمر افتراضي طويل\",\"إمكانية الاتصال بطرق متعددة\",\"لا تؤثر الاهتزازات على نتائج القياس\",\"نظام إدارة بيانات ذكي، يدعم تخزين بيانات التشخيص لمدة تصل إلى 3 أشهر\",\"استجابة سريعة في غضون ثوانٍ لتوفير تركيز الغازات المقاسة\",\"استهلاك طاقة منخفض\"]},{\"ID\":\"Gas-Analyzer-5\",\"title\":\"Gasboard-3000P\",\"image\":\"/images/sensors/gas-analyzer/gasboard-3000p.png\",\"infoTitle1\":\"النوع: محمول (portable)\",\"infoTitle2\":\"هذا الجهاز قادر على قياس غاز العملية لحظيًا وفي ظروف تشغيل قاسية.\",\"details\":[\"قياس متزامن لغازات O2، SO2، CO2، CO و NO \",\"عرض مؤشرات TPF (درجة الحرارة، الضغط والتدفق)\",\"استخدام مستشعر كهروكيميائي لقياس SO2، NO، CO و O2 ومستشعر NDIR لقياس تركيز CO2\",\"سعة ذاكرة كبيرة وإدارة بيانات سهلة\",\"حساب كفاءة الاحتراق \"]},{\"ID\":\"Gas-Analyzer-6\",\"title\":\"Gasboard-3800 plus\",\"image\":\"/images/sensors/gas-analyzer/gasboard-3800-plus.png\",\"infoTitle1\":\"النوع: محمول (portable)\",\"infoTitle2\":\"مزود بفاصل غاز-ماء لفصل الماء السائل من غاز العينة\",\"details\":[\"حاصل على شهادة براءة اختراع دولية (PCT approved) بناءً على تقنية micro-flow NDIR لقياس الغازات منخفضة التركيز\",\"أنبوب تسخين حتى 180 درجة مئوية يمنع الخسارة الناتجة عن تكثيف SO2.\",\"مبرد بلتييه مدمج يزيل بخار الماء من غاز العينة.\",\"طول مسبار أخذ العينات قابل للتخصيص\",\"مزود بمضخة حجابية بتدفق ≤60 لتر/ساعة\",\"تخزين تلقائي لبيانات القياس\"]},{\"ID\":\"Gas-Analyzer-7\",\"title\":\"Gasboard-3800 UV\",\"image\":\"/images/sensors/gas-analyzer/gasboard-3800-plus.png\",\"infoTitle1\":\"النوع: محمول (portable)\",\"infoTitle2\":\"غير متأثر بالرطوبة، الاهتزازات، درجة الحرارة والضغط المحيط\",\"details\":[\"مستشعر UV-DOAS متقدم لقياس مستويات منخفضة جدًا من SO2، NO و NO2 (أقل من 250 ppm). أقل نطاق قياس 0~50 ملغ/م³.\",\"حد كشف منخفض، دقة تصل إلى 0.1 ملغ/م³ لرصد الانبعاثات المنخفضة جدًا\",\"أنبوب تسخين حتى 180 درجة مئوية يمنع الخسارة الناتجة عن تكثيف SO2.\",\"مسبار أخذ العينات، الأنبوب الساخن وجهاز تهيئة الغاز مدمج لإزالة الرطوبة والغبار\",\"مبرد بلتييه مدمج يزيل بخار الماء من غاز العينة.\",\"طول مسبار أخذ العينات قابل للتخصيص\"]}],\"Flow Meter\":[{\"ID\":\"Flow-Meter-0\",\"title\":\"Gasboard-7900\",\"image\":\"/images/sensors/flow-meter/flow-meter-ultrasonic-7900.png\",\"infoTitle1\":\"هذا الفلومتر قادر على الرصد المستمر والمستقر في البيئات القاسية ذات درجات الحرارة العالية والرطوبة العالية والغبار الكثيف أثناء عملية تصريف غاز المداخن.\",\"details\":[\"مناسب لتدفقات الغاز الحمضية والرطبة\",\"نتيجة القياس لا تتأثر بتغيرات تركيب الغا 3050\",\"image\":\"/images/sensors/cems/gasboard-3050.png\",\"infoTitle1\":\"Gasboard-3050 يتميز بدقة عالية وعمر افتراضي طويل. هذا الجهاز محلل أكسجين ورطوبة وخيار مثالي لظروف الحرارة والرطوبة العالية.\",\"details\":[\"قياس متزامن لتركيز O2 و H2O\",\"لمنع تكثيف الماء، الكاشف مزود بسخان\",\"مصنوع من الفولاذ المقاوم للصدأ، مقاوم للتآكل ومناسب للبيئات القاسية\",\"يدعم الاتصال عبر RS232 و RS485\"]},{\"ID\":\"CEMS-2\",\"title\":\"GAS TDL-3000\",\"image\":\"/images/sensors/cems/gas-tdl-3000.png\",\"infoTitle2\":\"لا يحتاج إلى مشغل محترف\",\"details\":[\"لا تداخل متبادل: يستخدم تقنية TDLAS وطول موجة ليزر مخصص للغاز المقاس بدون تداخل مع غازات أخرى وقادر على الكشف السهل عن مكونات محددة في خليط الغاز\",\"دقة عالية: يتم التحكم بدقة في امتصاص الغاز لموجة معينة\",\"استجابة سريعة مقارنة بطرق الكشف الأخرى (كهروكيميائية، أشباه موصلات الأشعة تحت الحمراء...)\",\"نطاق قياس منخفض جدًا\",\"طريقة قياس استخراجية: لا يتأثر بالغبار، تقلبات درجة الحرارة والضغط في غاز المدخنة\",\"تركيب سهل\"]}]},\"active\":\"Dust Meter\",\"theme\":\"blue\",\"t\":{\"order\":\"اطلب الآن\",\"detail\":\"مزيد من التفاصيل\",\"specification\":\"المواصفات:\"}}]}]}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\na:null\n"])</script><script>self.__next_f.push([1,"14:I[8175,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"c:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"عداد الغبار الصناعي | أميران تدبير\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"أجهزة قياس الغبار والجسيمات العالقة بدقة عالية وأداء مستقر حتى في أقسى البيئات الصناعية، مثالية لمراقبة التلوث الجوي والانبعاثات.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"author\",\"content\":\"Gorbien\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"عداد غبار,غبارسنج,مقياس الغبار,جهاز قياس الجسيمات,dust meter,particle counter,قياس الغبار الصناعي,مراقبة الغبار,amirantadbir\"}],[\"$
